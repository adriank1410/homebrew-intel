name: Sequoia Intel bottles
on:
  push:
    branches: [main]
    paths: ['policy/build-request.json']
  workflow_dispatch:
    inputs:
      formula:
        description: Reviewed formula or comma-separated reviewed formulas, or all
        required: true
        default: simdutf
        type: string
  schedule:
    - cron: '41 3 * * 2'
permissions:
  contents: read
concurrency:
  group: intelbrew-bottles
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.repository == 'adriank1410/homebrew-intel' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || vars.INTELBREW_ENABLE_SCHEDULE == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      core_commit: ${{ steps.plan.outputs.core_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the trusted pipeline before allocating macOS runners
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check-project.py
      - id: plan
        env:
          REQUESTED_FORMULA: ${{ inputs.formula || 'all' }}
          REQUEST_SOURCE: ${{ github.event_name }}
        run: python3 scripts/plan-workflow.py
  build:
    needs: plan
    runs-on: macos-15-intel
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      INTELBREW_CORE_COMMIT: ${{ needs.plan.outputs.core_commit }}
      ROOT_FORMULA: ${{ matrix.root }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Isolate preseeded kegs and pin official Homebrew/core
        run: bash scripts/prepare-runner.sh
      - name: Exercise the native bridge before building
        run: INTELBREW_NATIVE_TESTS=1 /usr/bin/python3 -m unittest discover -s tests -p test_native.py -v
      - name: Build only missing bottles, with bounded licensing policy
        run: /usr/bin/python3 -m intelbrew.ci build --root "$ROOT_FORMULA" --output "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ matrix.root }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  collect-candidates:
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_artifacts: ${{ steps.select.outputs.has_artifacts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: select
        env:
          PLANNED_ROOTS: ${{ needs.plan.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select_artifacts.py --prefix candidate --planned-roots "$PLANNED_ROOTS"
  verify:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.collect-candidates.result == 'success' && needs.collect-candidates.outputs.has_artifacts == 'true' }}
    needs: [plan, collect-candidates]
    runs-on: macos-15-intel
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.collect-candidates.outputs.matrix) }}
    env:
      INTELBREW_CORE_COMMIT: ${{ needs.plan.outputs.core_commit }}
      ROOT_FORMULA: ${{ matrix.root }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-${{ matrix.root }}
          path: ${{ runner.temp }}/candidate
      - name: Fresh independent Intel macOS installation
        run: bash scripts/prepare-runner.sh
      - name: Bottle-only pour, receipts, linkage, formula tests and idempotence
        run: /usr/bin/python3 -m intelbrew.ci verify --root "$ROOT_FORMULA" --candidate "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/verified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-${{ matrix.root }}
          path: ${{ runner.temp }}/verified/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  collect-verified:
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    needs: [plan, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_artifacts: ${{ steps.select.outputs.has_artifacts }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: select
        env:
          PLANNED_ROOTS: ${{ needs.plan.outputs.matrix }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select_artifacts.py --prefix verified --planned-roots "$PLANNED_ROOTS"
  publish:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.plan.result == 'success' && needs.collect-verified.result == 'success' && needs.collect-verified.outputs.has_artifacts == 'true' }}
    needs: [plan, collect-verified]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.collect-verified.outputs.matrix) }}
    env:
      INTELBREW_CORE_COMMIT: ${{ needs.plan.outputs.core_commit }}
      ROOT_FORMULA: ${{ matrix.root }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-${{ matrix.root }}
          path: ${{ runner.temp }}/verified
      - name: Validate bounded data only; never source downloaded files
        id: validate
        run: python3 -m intelbrew.ci validate --root "$ROOT_FORMULA" --candidate "$RUNNER_TEMP/verified"
      - name: Attest verified bottle and accompanying source bundle
        if: steps.validate.outputs.has_bottles == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/verified/*.tar.gz
            ${{ runner.temp }}/verified/manifest.json
      - name: Publish immutable release and attested registry PR
        if: steps.validate.outputs.has_bottles == 'true'
        run: python3 -m intelbrew.publish --root "$ROOT_FORMULA" --candidate "$RUNNER_TEMP/verified"
