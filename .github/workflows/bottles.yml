name: Sequoia Intel bottles
on:
  push:
    branches: [main]
    paths: ['policy/build-request.json']
  workflow_dispatch:
    inputs:
      formula:
        description: Reviewed formula or comma-separated reviewed formulas, or all
        required: true
        default: simdutf
        type: string
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: read
concurrency:
  # Explicit single-root repairs must not queue behind a long scheduled sweep.
  group: intelbrew-bottles-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.formula != 'all' && !contains(inputs.formula, ',') && format('-{0}', inputs.formula) || '' }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.repository == 'adriank1410/homebrew-intel' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || vars.INTELBREW_ENABLE_SCHEDULE == 'true')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      core_commit: ${{ steps.plan.outputs.core_commit }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the trusted pipeline before allocating macOS runners
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/check-project.py
      - id: plan
        env:
          REQUESTED_FORMULA: ${{ inputs.formula || 'all' }}
          REQUEST_SOURCE: ${{ github.event_name }}
        run: python3 scripts/plan-workflow.py
  schedule-plan:
    if: >-
      ${{ needs.plan.outputs.has_work == 'true' &&
          (github.event_name == 'schedule' || inputs.formula == 'all') }}
    needs: plan
    runs-on: macos-15-intel
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    env:
      INTELBREW_CORE_COMMIT: ${{ needs.plan.outputs.core_commit }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin official Homebrew/core for native scheduled planning
        run: bash scripts/prepare-runner.sh
      - id: plan
        name: Select only roots with missing or stale bottles
        env:
          PLANNED_ROOTS: ${{ needs.plan.outputs.matrix }}
        run: /usr/bin/python3 scripts/native-plan.py
  root-pipeline:
    name: root-pipeline (${{ matrix.root }})
    needs: [plan, schedule-plan]
    if: >-
      ${{ always() && !cancelled() && needs.plan.result == 'success' &&
          (((github.event_name == 'schedule' || inputs.formula == 'all') && needs.schedule-plan.result == 'success' && needs.schedule-plan.outputs.has_work == 'true') ||
           (github.event_name != 'schedule' && inputs.formula != 'all' && needs.plan.outputs.has_work == 'true')) }}
    uses: ./.github/workflows/bottle-root.yml
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON((github.event_name == 'schedule' || inputs.formula == 'all') && needs.schedule-plan.outputs.matrix || needs.plan.outputs.matrix) }}
    with:
      root: ${{ matrix.root }}
      core_commit: ${{ needs.plan.outputs.core_commit }}
    secrets:
      app_private_key: ${{ secrets.INTELBREW_APP_PRIVATE_KEY }}
