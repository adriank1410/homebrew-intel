name: Registry maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: intelbrew-registry-maintenance
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'adriank1410/homebrew-intel' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.INTELBREW_ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Issue a short-lived token for this repository only
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.INTELBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTELBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-intel
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Reconcile attested registry PRs through required checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTELBREW_BOT_LOGIN: app/${{ steps.app-token.outputs.app-slug }}
          INTELBREW_ATTESTATION_TOKEN: ${{ github.token }}
        run: python3 -m intelbrew.registry_pr --reconcile
