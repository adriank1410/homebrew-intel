name: Registry maintenance
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  schedule:
    # Reconcile branch refreshes and merges promptly; concurrency below keeps
    # scheduled runs from overlapping while a previous pass is still active.
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: intelbrew-registry-maintenance
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'adriank1410/homebrew-intel' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.INTELBREW_ENABLE_SCHEDULE == 'true') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Issue a short-lived token for this repository only
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.INTELBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.INTELBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-intel
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Reconcile attested registry PRs through required checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTELBREW_BOT_LOGIN: app/${{ steps.app-token.outputs.app-slug }}
          INTELBREW_ATTESTATION_TOKEN: ${{ github.token }}
        run: python3 -m intelbrew.registry_pr --reconcile
      - name: Reconcile eligible installed-core additions through required checks
        if: ${{ !cancelled() && steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTELBREW_COVERAGE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/sync-coverage.py --reconcile
