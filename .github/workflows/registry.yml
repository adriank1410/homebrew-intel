name: Registry maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: intelbrew-registry-maintenance
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'adriank1410/homebrew-intel' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.INTELBREW_ENABLE_SCHEDULE == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Reconcile attested registry PRs through required checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m intelbrew.registry_pr --reconcile
